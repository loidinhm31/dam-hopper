<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opaque Plugin Frame</title>
  <style>body {
  margin: 0;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #1a1a1a;
  color: #e0e0e0;
}
.plugin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #333;
  padding-bottom: 12px;
}
.plugin-nav button {
  background: #2a2a2a;
  border: 1px solid #444;
  color: #ccc;
  padding: 6px 12px;
  margin-right: 8px;
  border-radius: 4px;
  cursor: pointer;
}
.plugin-nav button.active {
  background: #0066cc;
  color: #fff;
}
.view-panel {
  padding: 16px 0;
}
.handshake-badge {
  font-size: 12px;
  padding: 4px 8px;
  background: #333;
  border-radius: 4px;
}</style>
</head>

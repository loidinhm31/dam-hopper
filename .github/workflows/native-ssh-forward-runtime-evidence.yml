name: Native SSH Forward Windows Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      package-run-id:
        description: "Successful CI run containing dam-hopper-native-windows-preflight"
        required: true
        type: string
      evidence-run-id:
        description: "Run containing native-ssh-forward-runtime-evidence/evidence.json"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-windows-runtime:
    name: Validate protected Windows runtime evidence
    runs-on: windows-latest
    environment: native-ssh-forward-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Bind package run to the checked-out commit
        uses: actions/github-script@v7
        env:
          PACKAGE_RUN_ID: ${{ inputs.package-run-id }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            const packageRunId = Number(process["env"]["PACKAGE_RUN_ID"]);
            if (!Number.isSafeInteger(packageRunId) || packageRunId <= 0) {
              core.setFailed("package-run-id must be a positive workflow run ID");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: packageRunId,
            });
            if (run.status !== "completed" || run.conclusion !== "success") {
              core.setFailed("package workflow run did not complete successfully");
              return;
            }
            if (run.head_sha !== process["env"]["EXPECTED_SHA"]) {
              core.setFailed("package workflow run is not for the checked-out commit");
              return;
            }
            core.exportVariable("SMOKE_ARTIFACT_COMMIT_SHA", run.head_sha);

      - name: Bind submitted evidence run to the checked-out commit
        uses: actions/github-script@v7
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence-run-id }}
          COMMIT_BINDING: ${{ github.sha }}
        with:
          script: |
            const evidenceRunId = Number(process["env"]["EVIDENCE_RUN_ID"]);
            if (!Number.isSafeInteger(evidenceRunId) || evidenceRunId <= 0) {
              core.setFailed("evidence-run-id must be a positive workflow run ID");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: evidenceRunId,
            });
            if (run.status !== "completed" || run.conclusion !== "success") {
              core.setFailed("evidence workflow run did not complete successfully");
              return;
            }
            if (run.head_sha !== process["env"]["COMMIT_BINDING"]) {
              core.setFailed("evidence workflow run is not for the checked-out commit");
              return;
            }
            core.exportVariable("EVIDENCE_RUN_ID", String(evidenceRunId));

      - name: Download exact CI package
        uses: actions/download-artifact@v4
        with:
          name: dam-hopper-native-windows-preflight
          path: artifacts/native-ssh-forward/package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package-run-id }}

      - name: Download submitted runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: native-ssh-forward-runtime-evidence
          path: artifacts/native-ssh-forward
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Locate downloaded Windows package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/native-ssh-forward/package -Recurse -Filter *.exe)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows package, found $($packages.Count)" }
          "SMOKE_ARTIFACT_FILE=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows runtime preflight
        run: pnpm --filter @dam-hopper/native smoke:ssh-forward -- --runtime

      - name: Validate commit-bound package evidence
        env:
          SMOKE_EVIDENCE_FILE: artifacts/native-ssh-forward/evidence.json
          SMOKE_RELEASE_ENGINEER_ID: ${{ secrets.NATIVE_SSH_FORWARD_RELEASE_ENGINEER_ID }}
          SMOKE_SECURITY_REVIEWER_ID: ${{ secrets.NATIVE_SSH_FORWARD_SECURITY_REVIEWER_ID }}
          SMOKE_PRODUCT_OWNER_ID: ${{ secrets.NATIVE_SSH_FORWARD_PRODUCT_OWNER_ID }}
          SMOKE_RELEASE_ENGINEER_APPROVED_AT: ${{ secrets.NATIVE_SSH_FORWARD_RELEASE_ENGINEER_APPROVED_AT }}
          SMOKE_SECURITY_REVIEWER_APPROVED_AT: ${{ secrets.NATIVE_SSH_FORWARD_SECURITY_REVIEWER_APPROVED_AT }}
          SMOKE_PRODUCT_OWNER_APPROVED_AT: ${{ secrets.NATIVE_SSH_FORWARD_PRODUCT_OWNER_APPROVED_AT }}
        run: pnpm --filter @dam-hopper/native smoke:ssh-forward -- --validate-evidence

      - name: Upload validated evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-ssh-forward-validated-windows-evidence
          path: artifacts/native-ssh-forward/evidence.json
          if-no-files-found: error

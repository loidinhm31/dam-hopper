name: Linux Release Runtime Evidence (Fedora 44)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Must remain false; this workflow never publishes releases"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Must remain false; this workflow never publishes releases"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  collect-evidence:
    name: Validate protected Fedora 44 runtime and record bounded evidence
    runs-on: [self-hosted, linux, fedora44]
    environment: linux-release-runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Verify protected host and workflow safety invariants
        run: |
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            echo "Error: runtime evidence workflow is never allowed to publish releases" >&2
            exit 1
          fi
          if [[ "${DAM_HOPPER_PROTECTED_SNAPSHOT:-}" != "1" ]]; then
            echo "Error: DAM_HOPPER_PROTECTED_SNAPSHOT=1 is required on an isolated disposable runner" >&2
            exit 1
          fi
          if [[ "${EUID}" -ne 0 ]]; then
            echo "Error: protected runtime evidence must run as root" >&2
            exit 1
          fi

          OS_ID=$(source /etc/os-release && echo "$ID")
          OS_VER=$(source /etc/os-release && echo "$VERSION_ID")
          ARCH=$(uname -m)
          SYSTEMD_VER=$(systemctl --version | head -n1 | awk '{print $2}')
          GLIBC_VER=$(getconf GNU_LIBC_VERSION | awk '{print $2}')
          SELINUX_STATUS=$(getenforce 2>/dev/null || echo "Disabled")
          SYSTEM_STATE=$(systemctl is-system-running 2>/dev/null || true)

          echo "Detected Host: ${OS_ID} ${OS_VER} ${ARCH}, systemd ${SYSTEMD_VER}, glibc ${GLIBC_VER}, SELinux ${SELINUX_STATUS}, systemd-state ${SYSTEM_STATE}"
          if [[ "${OS_ID}" != "fedora" || "${OS_VER}" != "44" || "${ARCH}" != "x86_64" ]]; then
            echo "Error: Host does not match supported Fedora 44 x86_64 profile" >&2
            exit 1
          fi
          if [[ "${SYSTEMD_VER}" -lt 259 ]]; then
            echo "Error: systemd version ${SYSTEMD_VER} is below minimum 259" >&2
            exit 1
          fi
          if [[ "${GLIBC_VER}" != 2.43* ]]; then
            echo "Error: glibc ${GLIBC_VER} does not match the supported 2.43 profile" >&2
            exit 1
          fi
          if [[ "${SELINUX_STATUS}" != "Enforcing" ]]; then
            echo "Error: SELinux is not in Enforcing mode (status: ${SELINUX_STATUS})" >&2
            exit 1
          fi
          if [[ "${SYSTEM_STATE}" != "running" ]]; then
            echo "Error: systemd is not fully running (state: ${SYSTEM_STATE})" >&2
            exit 1
          fi
          echo "MEASURED_SYSTEMD_VER=${SYSTEMD_VER}" >> "$GITHUB_ENV"
          echo "MEASURED_GLIBC_VER=${GLIBC_VER}" >> "$GITHUB_ENV"
          echo "MEASURED_SELINUX=${SELINUX_STATUS}" >> "$GITHUB_ENV"
      - name: Download release assets under test
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        continue-on-error: true
        with:
          name: dam-hopper-release-assets
          path: artifacts/release

      - name: Ensure release bundle under test exists
        run: |
          ARCHIVE_NAME="dam-hopper-${{ inputs.tag }}-fedora44-x86_64-systemd.tar.gz"
          if [[ -f "artifacts/release/${ARCHIVE_NAME}" && -f "artifacts/release/release-manifest.json" ]]; then
            echo "Using downloaded release assets under test"
          else
            echo "Building and packaging release bundle under test..."
            pnpm install --frozen-lockfile
            cargo build --manifest-path server/Cargo.toml --release --features vendored --bins
            pnpm --filter @dam-hopper/web build
            pnpm release:package-twice -- \
              --version "${{ inputs.tag }}" \
              --target-dir "server/target/release" \
              --web-dist "apps/web/dist" \
              --output-dir "artifacts/release"
          fi
      - name: Run deterministic and real-process suites
        run: |
          mkdir -p evidence
          : > evidence/suite-results.tsv
          suite_failed=0

          run_suite() {
            local name="$1"
            local execution="$2"
            shift 2
            local started_at
            local finished_at
            local status
            local exit_code
            started_at="$(date --utc --iso-8601=seconds)"
            set +e
            "$@" >"evidence/${name}.log" 2>&1
            exit_code=$?
            set -e
            finished_at="$(date --utc --iso-8601=seconds)"
            if [[ "${exit_code}" -eq 0 ]]; then
              status="passed"
            else
              status="failed"
              suite_failed=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${name}" "${execution}" "${status}" "${exit_code}" \
              "${started_at}" "${finished_at}" "$*"
          }

          run_suite cleanInstall deterministic \
            cargo test --manifest-path server/Cargo.toml --features vendored \
            --test linux_release_staging --test linux_release_cli
          run_suite upgradeRollback deterministic \
            cargo test --manifest-path server/Cargo.toml --features vendored \
            --test linux_release_state_machine
          run_suite crashRecovery deterministic \
            cargo test --manifest-path server/Cargo.toml --features vendored \
            --test linux_release_state_machine
          run_suite migration deterministic \
            cargo test --manifest-path server/Cargo.toml --features vendored \
            --test linux_release_format2_migration_exchange \
            --test linux_release_format2_migration_drift \
            --test linux_release_format2_migration_fixture
          run_suite security deterministic \
            cargo test --manifest-path server/Cargo.toml --features vendored \
            --test linux_release_ownership --test linux_release_unit_policy \
            --test linux_release_acquisition
          run_suite webContract deterministic \
            cargo test --manifest-path server/Cargo.toml --features vendored \
            --test linux_release_web_host
          run_suite rootlessSmoke rootless bash tests/deploy/linux-release-rootless-smoke.sh
          run_suite protectedRuntime protected bash \
            tests/deploy/linux-release-protected-runtime.sh \
            --bundle-dir artifacts/release

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const suites = {};
          for (const line of readFileSync('evidence/suite-results.tsv', 'utf8').trim().split('\n')) {
            if (!line) continue;
            const [name, execution, status, exitCode, startedAt, finishedAt, ...command] =
              line.split('\t');
            suites[name] = {
              execution,
              status,
              exitCode: Number(exitCode),
              startedAt,
              finishedAt,
              command: command.join('\t'),
            };
          }
          writeFileSync(
            'evidence/suites.json',
            JSON.stringify(suites, null, 2) + '\n',
          );
          EOF

          if [[ "${suite_failed}" -ne 0 ]]; then
            echo "One or more release validation suites failed; evidence will be rejected." >&2
          fi

      - name: Generate bounded evidence artifact
        env:
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          ARCHIVE_DIGEST: ""
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p evidence
          ARCHIVE_NAME="dam-hopper-${TAG}-fedora44-x86_64-systemd.tar.gz"
          ARCHIVE_PATH="artifacts/release/${ARCHIVE_NAME}"
          if [[ ! -f "${ARCHIVE_PATH}" ]]; then
            echo "Error: Release archive ${ARCHIVE_PATH} was not built. Cannot produce runtime evidence." >&2
            exit 1
          fi
          export ARCHIVE_DIGEST
          ARCHIVE_DIGEST="$(sha256sum "${ARCHIVE_PATH}" | awk '{print $1}')"
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const evidence = {
            schemaVersion: 1,
            protocol: 'dam-hopper-linux-release-evidence',
            publish: false,
            commitSha: process.env.COMMIT_SHA,
            tag: process.env.TAG,
            archiveDigest: process.env.ARCHIVE_DIGEST,
            workflow: {
              runId: process.env.RUN_ID,
              runAttempt: process.env.RUN_ATTEMPT,
            },
            platform: {
              osId: 'fedora',
              osVersion: '44',
              arch: 'x86_64',
              systemdVersion: Number(process.env.MEASURED_SYSTEMD_VER),
              glibcVersion: process.env.MEASURED_GLIBC_VER,
              selinux: process.env.MEASURED_SELINUX,
            },
            suites: JSON.parse(readFileSync('evidence/suites.json', 'utf8')),
          };

          writeFileSync('evidence/evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          EOF

      - name: Validate evidence schema and commit binding
        run: |
          ARCHIVE_NAME="dam-hopper-${{ inputs.tag }}-fedora44-x86_64-systemd.tar.gz"
          ARCHIVE_DIGEST="$(sha256sum "artifacts/release/${ARCHIVE_NAME}" | awk '{print $1}')"
          node tests/deploy/linux-release-evidence-check.mjs \
            --evidence evidence/evidence.json \
            --expected-commit "${{ github.sha }}" \
            --expected-tag "${{ inputs.tag }}" \
            --expected-archive-digest "${ARCHIVE_DIGEST}"

      - name: Upload runtime evidence artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dam-hopper-linux-release-evidence
          path: evidence/evidence.json
          if-no-files-found: error
          retention-days: 14

name: Release Linux and Windows (x86_64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run packaging without publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-metadata:
    name: Validate release version and metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.tag }}
      release_version: ${{ steps.resolve.outputs.version }}
      is_dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve release tag and version
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '${TAG}' does not match format vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      - name: Verify version alignment across Cargo and web packages
        run: |
          node deploy/release/check-version-alignment.mjs "${{ steps.resolve.outputs.tag }}"

  build-rust:
    name: Build Rust release binaries (x86_64-unknown-linux-gnu)
    needs: validate-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: "release-ubuntu-latest"
      - name: Build all release binaries
        run: |
          cd server
          cargo build --release --features vendored --target x86_64-unknown-linux-gnu --bins

      - name: Verify compiled binary version output
        run: |
          server/target/x86_64-unknown-linux-gnu/release/dam-hopper --version
          server/target/x86_64-unknown-linux-gnu/release/dam-hopper-server --version
          server/target/x86_64-unknown-linux-gnu/release/dam-hopper-web --version
          server/target/x86_64-unknown-linux-gnu/release/dam-hopper-idle-suspend-helper --version
          server/target/x86_64-unknown-linux-gnu/release/dam-hopper-plugin-runner --version

      - name: Upload compiled Rust binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            server/target/x86_64-unknown-linux-gnu/release/dam-hopper
            server/target/x86_64-unknown-linux-gnu/release/dam-hopper-server
            server/target/x86_64-unknown-linux-gnu/release/dam-hopper-web
            server/target/x86_64-unknown-linux-gnu/release/dam-hopper-idle-suspend-helper
            server/target/x86_64-unknown-linux-gnu/release/dam-hopper-plugin-runner
          if-no-files-found: error
          retention-days: 1

  build-rust-windows:
    name: Build Rust release binary (x86_64-pc-windows-msvc)
    needs: validate-metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: "release-windows-latest"

      - name: Build Windows release server binary
        run: |
          cd server
          cargo build --release --target x86_64-pc-windows-msvc --bin dam-hopper-server

      - name: Verify compiled binary version output
        shell: bash
        run: |
          server/target/x86_64-pc-windows-msvc/release/dam-hopper-server.exe --version

      - name: Upload compiled Windows Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-windows
          path: server/target/x86_64-pc-windows-msvc/release/dam-hopper-server.exe
          if-no-files-found: error
          retention-days: 1

  build-web:
    name: Build web assets
    needs: validate-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm --filter @dam-hopper/web build

      - name: Verify web dist outputs
        run: |
          test -f apps/web/dist/index.html
          if grep -rn "VITE_DAM_HOPPER_SERVER_URL" apps/web/dist/; then
            echo "Error: Host-specific VITE_DAM_HOPPER_SERVER_URL found in built web dist" >&2
            exit 1
          fi

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  package-release:
    name: Package deterministic archive, manifest, and SBOM
    needs: [validate-metadata, build-rust, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: artifacts/bin

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Make binaries executable
        run: |
          chmod +x artifacts/bin/dam-hopper artifacts/bin/dam-hopper-server artifacts/bin/dam-hopper-web artifacts/bin/dam-hopper-idle-suspend-helper artifacts/bin/dam-hopper-plugin-runner

      - name: Package archive twice and validate exact release subjects
        env:
          SOURCE_DATE_EPOCH: 1700000000
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          pnpm release:package-twice \
            --version "${{ needs.validate-metadata.outputs.release_tag }}" \
            --target-dir "artifacts/bin" \
            --web-dist "apps/web/dist" \
            --output-dir "artifacts/final"

      - name: Upload final Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-linux-release-assets
          path: artifacts/final/*
          if-no-files-found: error
          retention-days: 7

  package-windows-release:
    name: Package deterministic Windows archive and installer
    needs: [validate-metadata, build-rust-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download Windows Rust binary
        uses: actions/download-artifact@v4
        with:
          name: rust-binary-windows
          path: artifacts/bin

      - name: Package Windows archive twice and validate Windows release subjects
        env:
          SOURCE_DATE_EPOCH: 1700000000
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/deploy/windows-release-package-twice.ps1 `
            -Version "${{ needs.validate-metadata.outputs.release_tag }}" `
            -BinaryPath "artifacts/bin/dam-hopper-server.exe" `
            -OutputDir "artifacts/final" `
            -Epoch 1700000000

      - name: Upload final Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-windows-release-assets
          path: artifacts/final/*
          if-no-files-found: error
          retention-days: 7
  attest-release:
    name: Generate GitHub artifact attestations
    needs: [validate-metadata, package-release, package-windows-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download final Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: dam-hopper-linux-release-assets
          path: artifacts/final

      - name: Download final Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: dam-hopper-windows-release-assets
          path: artifacts/final

      - name: Attest all six release subjects
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/final/dam-hopper-install.sh
            artifacts/final/dam-hopper-${{ needs.validate-metadata.outputs.release_tag }}-linux-x86_64-systemd.tar.gz
            artifacts/final/release-manifest.json
            artifacts/final/dam-hopper-${{ needs.validate-metadata.outputs.release_tag }}-linux-x86_64-systemd.spdx.json
            artifacts/final/dam-hopper-install.ps1
            artifacts/final/dam-hopper-${{ needs.validate-metadata.outputs.release_tag }}-windows-x86_64.zip
  publish-release:
    name: Publish immutable GitHub release
    needs:
      [
        validate-metadata,
        package-release,
        package-windows-release,
        attest-release,
      ]
    if: needs.validate-metadata.outputs.is_dry_run != 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: linux-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download final Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: dam-hopper-linux-release-assets
          path: artifacts/final

      - name: Download final Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: dam-hopper-windows-release-assets
          path: artifacts/final
      - name: Create draft release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-metadata.outputs.release_tag }}
        run: |
          echo "Cleaning up any stale draft release for ${TAG}..."
          gh release delete "${TAG}" -y || true
          echo "Creating draft release for ${TAG}..."
          gh release create "${TAG}" \
            artifacts/final/* \
            --draft \
            --title "DamHopper ${TAG}" \
            --notes "See release-manifest.json and dam-hopper-install.sh for Linux, or dam-hopper-install.ps1 for Windows verified installation instructions."

      - name: Query draft release and verify exact 6 assets (all profiles)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-metadata.outputs.release_tag }}
          ALLOW_UNVERIFIED_PUBLISH: "true"
        run: |
          RELEASE_ID=$(gh release view "${TAG}" --json databaseId --jq '.databaseId')
          node deploy/release/check-release-assets.mjs \
            --profile all \
            --tag "${TAG}" \
            --dir "artifacts/final" \
            --release-id "${RELEASE_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --allow-unverified-publish

      - name: Publish release (undraft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-metadata.outputs.release_tag }}
        run: |
          echo "Publishing release ${TAG}..."
          gh release edit "${TAG}" --draft=false
          echo "✓ Successfully published release ${TAG}:"
          gh release view "${TAG}" --json url --jq '.url'

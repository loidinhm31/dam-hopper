name: Build DamHopper Desktop App

on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  actions: read
jobs:
  native-ssh-forward-windows-gate:
    name: Windows SSH forwarding pre-bundle gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native client
        run: pnpm --filter @dam-hopper/native build

      - name: Run Windows native forwarding gates
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/native/src-tauri/Cargo.toml
          pnpm --filter @dam-hopper/native test:e2e:ssh-forward
          pnpm --filter @dam-hopper/native smoke:ssh-forward -- --build-only
          pnpm --filter @dam-hopper/native exec tauri build --no-bundle

  native-ssh-forward-windows-runtime-gate:
    name: Windows SSH forwarding protected runtime gate
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: native-ssh-forward-windows-gate
    runs-on: windows-latest
    steps:
      - name: Find successful protected runtime evidence
        uses: actions/github-script@v7
        env:
          COMMIT_BINDING: ${{ github.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "native-ssh-forward-runtime-evidence.yml",
              head_sha: process["env"]["COMMIT_BINDING"],
              status: "success",
              per_page: 100,
            });
            const run = data.workflow_runs
              .filter(
                (candidate) =>
                  candidate.head_sha === process["env"]["COMMIT_BINDING"] &&
                  candidate.status === "completed" &&
                  candidate.conclusion === "success",
              )
              .sort(
                (left, right) =>
                  Date.parse(right.created_at) - Date.parse(left.created_at),
              )[0];
            if (!run) {
              core.setFailed(
                "no successful protected Windows runtime evidence exists for this commit",
              );
              return;
            }
            core.exportVariable("RUNTIME_EVIDENCE_RUN_ID", String(run.id));

      - name: Download validated protected runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: native-ssh-forward-validated-windows-evidence
          path: artifacts/native-ssh-forward
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUNTIME_EVIDENCE_RUN_ID }}

  build-desktop:
    needs:
      - native-ssh-forward-windows-gate
      - native-ssh-forward-windows-runtime-gate
    if: >-
      ${{
        always() &&
        needs.native-ssh-forward-windows-gate.result == 'success' &&
        (
          needs.native-ssh-forward-windows-runtime-gate.result == 'success' ||
          !startsWith(github.ref, 'refs/tags/desktop-v')
        )
      }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            bundles: deb,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            bundles: nsis

    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Windows icon
        if: startsWith(matrix.platform.os, 'windows')
        shell: pwsh
        run: |
          # Install ImageMagick via Chocolatey if not exists
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y
            # Refresh environment to get magick in PATH
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          # Verify icon.ico exists, if not generate it
          if (-not (Test-Path "apps/native/src-tauri/icons/icon.ico")) {
            magick apps/native/src-tauri/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 apps/native/src-tauri/icons/icon.ico
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ !startsWith(matrix.platform.os, 'windows') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ !startsWith(matrix.platform.os, 'windows') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: apps/native
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: "DamHopper Desktop v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ !startsWith(matrix.platform.os, 'windows') }}
          args: >-
            --bundles ${{ matrix.platform.bundles }}
            ${{ startsWith(matrix.platform.os, 'windows') && '--config src-tauri/tauri.windows.package.conf.json' || '' }}

name: Build DamHopper App

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            bundles: deb,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            bundles: nsis

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Windows icon
        if: startsWith(matrix.platform.os, 'windows')
        shell: pwsh
        run: |
          # Install ImageMagick via Chocolatey if not exists
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y
            # Refresh environment to get magick in PATH
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          # Verify icon.ico exists, if not generate it
          if (-not (Test-Path "apps/native/src-tauri/icons/icon.ico")) {
            magick apps/native/src-tauri/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 apps/native/src-tauri/icons/icon.ico
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "21"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/native
          tagName: ${{ github.ref_name }}
          releaseName: "DamHopper v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.platform.bundles }}

  build-server:
    name: Build server and signed semantic bundle package (${{ matrix.platform.name }})
    needs: build-desktop
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            source: linux-x86_64
          - name: windows-x86_64
            os: windows-latest
            source: windows-x86_64
    runs-on: ${{ matrix.platform.os }}
    env:
      # The binary only trusts bundles signed by this release public key. If
      # no bundle input is supplied, the semantic capability stays unavailable.
      DAM_HOPPER_SEMANTIC_BUNDLE_PUBLIC_KEY: ${{ secrets.DAM_HOPPER_SEMANTIC_BUNDLE_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build server
        run: cd server && cargo build --release --features vendored

      - name: Stage signed semantic bundle when supplied
        if: hashFiles(format('release/semantic-bundles/{0}/manifest.json', matrix.platform.source)) != ''
        shell: bash
        run: |
          BIN_PATH="$(find server -type f -name 'dam-hopper-server*' -path '*/release/*' -print -quit)"
          test -n "$BIN_PATH"
          bash scripts/prepare-semantic-bundle-release.sh "release/semantic-bundles/${{ matrix.platform.source }}" "$(dirname "$BIN_PATH")/semantic-bundles"

      - name: Upload server release package
        uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-server-${{ matrix.platform.name }}
          path: |
            server/**/release/dam-hopper-server*
            server/**/release/semantic-bundles
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Run semantic bundle release-script tests
        run: scripts/test-semantic-bundle-release.sh

      - name: Run tests
        run: cd server && cargo test --features vendored

  build-linux:
    name: Build (linux-x86_64)
    runs-on: ubuntu-latest
    needs: test
    env:
      # Empty means semantic capabilities remain unavailable. A release build
      # must provide the matching signed bundle and public key together.
      DAM_HOPPER_SEMANTIC_BUNDLE_PUBLIC_KEY: ${{ secrets.DAM_HOPPER_SEMANTIC_BUNDLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build release binary
        run: cd server && cargo build --release --features vendored

      - name: Stage signed semantic bundle when supplied
        if: hashFiles('release/semantic-bundles/linux-x86_64/manifest.json') != ''
        run: |
          BIN_PATH="$(find server -type f -name dam-hopper-server -path '*/release/*' -print -quit)"
          test -n "$BIN_PATH"
          bash scripts/prepare-semantic-bundle-release.sh release/semantic-bundles/linux-x86_64 "$(dirname "$BIN_PATH")/semantic-bundles"

      - uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-server-linux-x86_64
          path: server/target/release/dam-hopper-server
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: hashFiles('server/**/release/semantic-bundles/manifest.json') != ''
        with:
          name: dam-hopper-semantic-bundle-linux-x86_64
          path: server/**/release/semantic-bundles
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build (windows-x86_64)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # The unsupported envelope is selected at compile time on Windows; run
      # the test suite here so release validation has a real non-Linux runtime.
      - name: Run server tests on Windows
        run: cd server && cargo test --features vendored

      - name: Build release binary
        run: cd server && cargo build --release --features vendored

      - uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-server-windows-x86_64
          path: server/target/release/dam-hopper-server.exe
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run semantic Monaco browser gate
        run: pnpm --filter @dam-hopper/ui exec vitest run --config vitest.browser.config.ts browser-tests/semantic-navigation-compat.browser.tsx

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  native-linux:
    name: Native Linux build and package gates (unverified runtime)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebKitGTK and Tauri packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native client
        run: pnpm --filter @dam-hopper/native build

      - name: Run deterministic smoke checks
        run: pnpm --filter @dam-hopper/native smoke:build

      - name: Run native Rust tests
        run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml --quiet

      - name: Package Linux deb and rpm artifacts
        run: pnpm --filter @dam-hopper/native tauri:build --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-native-linux-unverified
          path: |
            apps/native/src-tauri/target/release/bundle/deb/*.deb
            apps/native/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  native-windows:
    name: Native Windows build gate (runtime evidence required separately)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native client
        run: pnpm --filter @dam-hopper/native build

      - name: Run deterministic smoke checks
        run: pnpm --filter @dam-hopper/native smoke:build

      - name: Package Windows installer
        run: pnpm --filter @dam-hopper/native tauri:build --bundles nsis

      - name: Record WebView2 preflight
        run: pnpm --filter @dam-hopper/native tauri:probe

      - uses: actions/upload-artifact@v4
        with:
          name: dam-hopper-native-windows-preflight
          path: apps/native/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

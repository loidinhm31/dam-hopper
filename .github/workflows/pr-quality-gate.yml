name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  static_build:
    name: Lint, typecheck, and frontend builds
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint workspace
        run: pnpm lint
      - name: Typecheck and build shared packages
        run: |
          pnpm --filter @dam-hopper/shared build
          pnpm --filter @dam-hopper/browser-bridge typecheck
          pnpm --filter @dam-hopper/browser-bridge build
          pnpm --filter @dam-hopper/ui build
      - name: Typecheck and build browser extension
        run: |
          pnpm --filter @dam-hopper/browser-extension typecheck
          pnpm --filter @dam-hopper/browser-extension build
      - name: Build web app
        run: pnpm --filter @dam-hopper/web build
      - name: Build native frontend
        run: pnpm --filter @dam-hopper/native build

  js_tests:
    name: JS tests - ${{ matrix.suite }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shared
            command: pnpm --filter @dam-hopper/shared test
          - suite: browser-bridge
            command: pnpm --filter @dam-hopper/browser-bridge test
          - suite: ui
            command: pnpm --filter @dam-hopper/ui test
          - suite: native
            command: pnpm --filter @dam-hopper/native test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native frontend for native smoke-backed tests
        if: matrix.suite == 'native'
        run: pnpm --filter @dam-hopper/native build
      - name: Run ${{ matrix.suite }} tests
        run: ${{ matrix.command }}

  browser_tests:
    name: Chromium browser regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dam-hopper/ui exec playwright install --with-deps chromium
      - name: Run all UI browser tests
        run: pnpm --filter @dam-hopper/ui test:browser

  server_linux:
    name: Rust server - Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Clippy production targets
        run: cargo clippy --manifest-path server/Cargo.toml --lib --bins
      - name: Server tests
        run: cargo test --manifest-path server/Cargo.toml

  server_windows:
    name: Rust server - Windows compile
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Compile all server tests
        run: cargo test --manifest-path server/Cargo.toml --no-run
      - name: Check all server targets
        run: cargo check --manifest-path server/Cargo.toml --all-targets

  native_linux:
    name: Native client - Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build browser bridge prerequisite
        run: pnpm --filter @dam-hopper/browser-bridge build
      - name: Clippy
        # Keep Clippy visible, but do not let inherited warning debt prevent the
        # platform tests and E2E gates from executing. Compilation errors still fail.
        run: cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets
      - name: Native Rust tests
        run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml
      - name: Native frontend build
        run: pnpm --filter @dam-hopper/native build
      - name: Native smoke build
        run: pnpm --filter @dam-hopper/native smoke:ssh-forward
      - name: Tauri compile without bundle
        run: pnpm --filter @dam-hopper/native exec tauri build --no-bundle

  native_windows:
    name: Native client - Windows SSH gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native frontend
        run: pnpm --filter @dam-hopper/native build
      - name: Build browser bridge prerequisite
        run: pnpm --filter @dam-hopper/browser-bridge build
      - name: Clippy
        # Windows currently has inherited Clippy warning debt. Keep diagnostics
        # in CI while allowing the stronger Rust tests and SSH E2E gate to run.
        run: cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets
      - name: Native Rust tests
        run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml
      - name: SSH forwarding E2E
        run: pnpm --filter @dam-hopper/native test:e2e:ssh-forward
      - name: SSH forwarding smoke build
        run: pnpm --filter @dam-hopper/native smoke:ssh-forward
      - name: Tauri compile without bundle
        run: pnpm --filter @dam-hopper/native exec tauri build --no-bundle

  release_contract_linux:
    name: Release contract - Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release scripts and version alignment
        run: pnpm release:verify
      - name: Validate Linux release evidence checker source
        run: node --check tests/deploy/linux-release-evidence-check.mjs

  release_contract_windows:
    name: Release contract - Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify PowerShell and Windows release scripts
        shell: pwsh
        run: pnpm release:verify-windows
      - name: Run Windows release asset gate tests
        run: pnpm release:windows-gate-test

  quality_gate:
    name: Quality Gate
    if: always()
    needs:
      - static_build
      - js_tests
      - browser_tests
      - server_linux
      - server_windows
      - native_linux
      - native_windows
      - release_contract_linux
      - release_contract_windows
    runs-on: ubuntu-22.04
    steps:
      - name: Require every quality job
        env:
          STATIC_BUILD: ${{ needs.static_build.result }}
          JS_TESTS: ${{ needs.js_tests.result }}
          BROWSER_TESTS: ${{ needs.browser_tests.result }}
          SERVER_LINUX: ${{ needs.server_linux.result }}
          SERVER_WINDOWS: ${{ needs.server_windows.result }}
          NATIVE_LINUX: ${{ needs.native_linux.result }}
          NATIVE_WINDOWS: ${{ needs.native_windows.result }}
          RELEASE_LINUX: ${{ needs.release_contract_linux.result }}
          RELEASE_WINDOWS: ${{ needs.release_contract_windows.result }}
        run: |
          for result in \
            "$STATIC_BUILD" \
            "$JS_TESTS" \
            "$BROWSER_TESTS" \
            "$SERVER_LINUX" \
            "$SERVER_WINDOWS" \
            "$NATIVE_LINUX" \
            "$NATIVE_WINDOWS" \
            "$RELEASE_LINUX" \
            "$RELEASE_WINDOWS"; do
            if [ "$result" != "success" ]; then
              echo "A required quality job finished with: $result"
              exit 1
            fi
          done
          echo "All PR quality gates passed."

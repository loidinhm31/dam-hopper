name: Release Android Native App

"on":
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag override (e.g. v0.13.2 or android-v0.1.0)"
        required: false
        type: string
        default: ""
      build_debug_only:
        description: "Build un-signed debug APK for testing (skips release signing requirements)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate Android Version & Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      version_code: ${{ steps.version_info.outputs.version_code }}
      tag_name: ${{ steps.version_info.outputs.tag_name }}
      is_debug_only: ${{ steps.version_info.outputs.is_debug_only }}
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract and Validate Semantic Version
        id: version_info
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DEBUG_ONLY: ${{ github.event.inputs.build_debug_only || 'false' }}
        run: |
          TARGET_TAG="${INPUT_TAG:-$REF_NAME}"
          echo "Evaluating tag: $TARGET_TAG"

          # Extract raw version from tag: handles v0.1.0 or android-v0.1.0
          if [[ "$TARGET_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RAW_VER="${BASH_REMATCH[1]}"
          elif [[ "$TARGET_TAG" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RAW_VER="${BASH_REMATCH[1]}"
          elif [ "$DEBUG_ONLY" = "true" ]; then
            RAW_VER="0.1.0"
          else
            echo "::error::Tag '$TARGET_TAG' does not conform to 'v<major>.<minor>.<patch>' or 'android-v<major>.<minor>.<patch>'."
            exit 1
          fi

          GRADLE_PROP="native/android-app/gradle.properties"
          if [ ! -f "$GRADLE_PROP" ]; then
            echo "::error::$GRADLE_PROP not found in repository."
            exit 1
          fi

          PROP_VERSION=$(grep -E '^[[:space:]]*appVersion=' "$GRADLE_PROP" | cut -d'=' -f2 | tr -d '[:space:]')
          PROP_CODE=$(grep -E '^[[:space:]]*appVersionCode=' "$GRADLE_PROP" | cut -d'=' -f2 | tr -d '[:space:]')

          echo "Target release version: $RAW_VER"
          echo "Committed appVersion: '$PROP_VERSION'"
          echo "Committed appVersionCode: '$PROP_CODE'"

          FINAL_CODE="${PROP_CODE:-1}"
          if ! [[ "$FINAL_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::appVersionCode '$FINAL_CODE' is not a strictly positive integer."
            exit 1
          fi

          echo "version=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$FINAL_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "is_debug_only=$DEBUG_ONLY" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### 📱 Android Version Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ steps.version_info.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version Code**: \`${{ steps.version_info.outputs.version_code }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: \`${{ steps.version_info.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug-only Mode**: \`${{ steps.version_info.outputs.is_debug_only }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-android-release:
    name: Build Signed Android Release APK
    needs: validate-version
    if: needs.validate-version.outputs.is_debug_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK and Install Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x native/android-app/gradlew
      - name: Enforce Release Signing Custody and Keystore Preflight
        env:
          KEYSTORE_BASE64: ${{ secrets.DAMHOPPER_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.DAMHOPPER_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.DAMHOPPER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DAMHOPPER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release build requires signing custody. Required repository secrets: DAMHOPPER_KEYSTORE_BASE64, DAMHOPPER_KEY_ALIAS, DAMHOPPER_STORE_PASSWORD, DAMHOPPER_KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/damhopper-release.jks"
          ( umask 077 && echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH" )
          chmod 600 "$KEYSTORE_PATH"

          echo "=== Inspecting Release Keystore Entries ==="
          STORE_PASSWORD="$STORE_PASSWORD" keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env STORE_PASSWORD || {
            echo "::error::Failed to open keystore with DAMHOPPER_STORE_PASSWORD."
            exit 1
          }

          if ! STORE_PASSWORD="$STORE_PASSWORD" keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Release signing preflight failed: Key alias '$KEY_ALIAS' not found in keystore."
            exit 1
          fi

          if ! STORE_PASSWORD="$STORE_PASSWORD" KEY_PASSWORD="$KEY_PASSWORD" keytool -certreq \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD >/dev/null 2>&1; then
            echo "::error::Release signing preflight failed: private key recovery failed with DAMHOPPER_KEY_PASSWORD."
            exit 1
          fi

          echo "Release signing credentials and key alias preflight verified successfully."

      - name: Install Rust Toolchain for Android ABIs
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo-ndk binary
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-bin-ubuntu-latest

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Cross-compile Crypto Bridge cdylib for Android ABIs
        run: |
          cd native/android-app/crypto-bridge
          cargo ndk -t arm64-v8a -t x86_64 -o ../androidApp/src/main/jniLibs build --release

      - name: Assemble Signed Android Release APK
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version.outputs.version_code }}
          KEY_ALIAS: ${{ secrets.DAMHOPPER_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.DAMHOPPER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DAMHOPPER_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/damhopper-release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Release keystore missing at $KEYSTORE_PATH"
            exit 1
          fi

          cd native/android-app
          DAMHOPPER_KEYSTORE="$KEYSTORE_PATH" \
          DAMHOPPER_KEY_ALIAS="$KEY_ALIAS" \
          DAMHOPPER_STORE_PASSWORD="$STORE_PASSWORD" \
          DAMHOPPER_KEY_PASSWORD="$KEY_PASSWORD" \
          ./gradlew :androidApp:assembleRelease \
            -PappVersion="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            --dependency-verification=off

      - name: Audit Release APK Security
        run: |
          node native/android-app/scripts/release-security-check.mjs \
            --apk native/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Clean Up Temporary Release Keystore
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ] && [ -f "${RUNNER_TEMP}/damhopper-release.jks" ]; then
            shred -u "${RUNNER_TEMP}/damhopper-release.jks" 2>/dev/null || rm -f "${RUNNER_TEMP}/damhopper-release.jks"
            echo "Keystore file securely removed."
          fi

      - name: Stage Final Android Release APK
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          mkdir -p final-android
          TARGET_FILE="final-android/damhopper-android-${VERSION}.apk"
          SRC_FILE="native/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk"

          if [ ! -f "$SRC_FILE" ]; then
            echo "::error::Expected release APK not found at: $SRC_FILE"
            exit 1
          fi

          cp "$SRC_FILE" "$TARGET_FILE"
          if [ ! -s "$TARGET_FILE" ]; then
            echo "::error::Staged APK file '$TARGET_FILE' is empty!"
            exit 1
          fi

          echo "Staged Android Release APK:"
          ls -lh final-android/

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: damhopper-android-release-apk
          path: final-android/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Attach Android Release APK to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')) && needs.validate-version.outputs.is_debug_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-version.outputs.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "No release tag resolved, skipping release attachment."
            exit 0
          fi

          echo "Target release tag: $TAG"

          # If this is a unified repository release (v*), wait for release-linux workflow to publish the release
          if [[ "$TAG" == v* ]]; then
            echo "Waiting for GitHub release $TAG to be published..."
            for i in {1..30}; do
              STATUS=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "false" ]; then
                echo "Release $TAG is published!"
                break
              fi
              echo "Release $TAG status is '$STATUS', waiting 30s (attempt $i/30)..."
              sleep 30
            done
          fi

          # If release does not exist yet (e.g. android-v* tag), create it
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating release for $TAG..."
            gh release create "$TAG" final-android/*.apk \
              --title "DamHopper Android $TAG" \
              --notes "DamHopper Android Native App release for $TAG."
          else
            echo "Uploading APK to release $TAG..."
            gh release upload "$TAG" final-android/*.apk --clobber
          fi

          echo "✓ Successfully attached Android Release APK to GitHub release $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".apk")) | {name, size, url}'

  build-android-debug:
    name: Build Un-signed Android Debug APK (Diagnostic)
    needs: validate-version
    if: needs.validate-version.outputs.is_debug_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK and Install Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x native/android-app/gradlew

      - name: Assemble Android Debug APK
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version.outputs.version_code }}
        run: |
          cd native/android-app
          ./gradlew :androidApp:assembleDebug \
            -PappVersion="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            --dependency-verification=off

      - name: Stage Final Android Debug APK
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          mkdir -p final-android
          TARGET_FILE="final-android/damhopper-android-debug-${VERSION}.apk"
          SRC_FILE="native/android-app/androidApp/build/outputs/apk/debug/androidApp-debug.apk"

          if [ ! -f "$SRC_FILE" ]; then
            echo "::error::Expected debug APK not found at: $SRC_FILE"
            exit 1
          fi

          cp "$SRC_FILE" "$TARGET_FILE"
          echo "Staged Android Debug APK:"
          ls -lh final-android/

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: damhopper-android-debug-apk
          path: final-android/*.apk
          if-no-files-found: error
          retention-days: 7

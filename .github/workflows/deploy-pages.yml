name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_DAM_HOPPER_EXTENSION_PARENT_ORIGINS: ${{ vars.VITE_DAM_HOPPER_EXTENSION_PARENT_ORIGINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify Browser Debug extension origin
        run: |
          if [ -z "$VITE_DAM_HOPPER_EXTENSION_PARENT_ORIGINS" ]; then
            echo "::error::VITE_DAM_HOPPER_EXTENSION_PARENT_ORIGINS is empty. Add it under the github-pages Environment variables."
            exit 1
          fi
          echo "Browser Debug extension parent origins: $VITE_DAM_HOPPER_EXTENSION_PARENT_ORIGINS"

      - name: Build Web
        # Dynamically set the base path from GitHub Pages configuration
        run: pnpm --filter @dam-hopper/web build --base=${{ steps.pages.outputs.base_path }}/

      - name: 404.html Trick
        # Copy index.html to 404.html to handle client-side routing refreshes on GitHub Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "apps/web/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

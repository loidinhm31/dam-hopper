<text x="800" y="284" fill="#3B82F6" font-size="10">^⌥D</text>
<text x="22" y="320" fill="#F97316" font-size="11" font-weight="700">RECIPES</text>
<text x="34" y="346" fill="#F8FAFC" font-size="11">▸ Launch: Full-Stack Feature Sprint → new desktop</text>
<text x="780" y="346" fill="#3B82F6" font-size="10">!sprint</text>

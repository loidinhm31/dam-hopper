<text x="22" y="206" fill="#7689A2" font-size="11" font-weight="700">WINDOWS &amp; DESKTOPS</text>
<text x="34" y="232" fill="#F8FAFC" font-size="11">▸ Pop out / snap back focused window</text>
<text x="800" y="232" fill="#3B82F6" font-size="10">^⌥F</text>
